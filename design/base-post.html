<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Base de post 1080 x 1350</title>
<!--
  BASE DE POST. Copie este arquivo para rascunhos/<slug>/ e mude só:
  1. as variáveis de :root (cores e fontes do design system do CLAUDE.md);
  2. os textos marcados com MUDAR.
  Para carrossel, faça um arquivo por tela: capa com class="tela capa",
  telas do meio com class="tela" e a última com class="tela final".
  Render (Mac):
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --hide-scrollbars --window-size=1080,1350 --screenshot=saida.png arquivo.html
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --fundo: #111418;
    --texto: #f4f1ea;
    --destaque: #ffb703;
    --apoio: #9aa3ad;
    --fonte-titulo: "Montserrat", "Helvetica Neue", Arial, sans-serif;
    --fonte-texto: "Inter", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { background: var(--fundo); color: var(--texto); font-family: var(--fonte-texto); }
  .tela { width: 1080px; height: 1350px; padding: 88px 84px 76px; display: flex; flex-direction: column; }
  .topo { display: flex; justify-content: space-between; align-items: center; font-size: 30px; font-weight: 600; color: var(--apoio); }
  .topo .marca { color: var(--texto); }
  .miolo { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .chapeu { display: inline-block; align-self: flex-start; background: var(--destaque); color: var(--fundo); font-weight: 600; font-size: 28px; letter-spacing: 2px; text-transform: uppercase; padding: 12px 22px; border-radius: 8px; margin-bottom: 44px; }
  h1 { font-family: var(--fonte-titulo); font-weight: 800; font-size: 104px; line-height: 1.04; letter-spacing: -2px; }
  h1 em { font-style: normal; color: var(--destaque); }
  .linha { width: 140px; height: 8px; background: var(--destaque); margin: 48px 0 40px; }
  p { font-size: 42px; line-height: 1.35; color: var(--texto); max-width: 860px; }
  .rodape { display: flex; justify-content: space-between; align-items: center; font-size: 30px; color: var(--apoio); border-top: 2px solid rgba(255,255,255,0.14); padding-top: 30px; }
  .rodape strong { color: var(--destaque); font-weight: 600; }
  /* variações para carrossel */
  .capa { background: var(--destaque); color: var(--fundo); }
  .capa .topo, .capa .topo .marca, .capa p, .capa .rodape { color: var(--fundo); }
  .capa .chapeu { background: var(--fundo); color: var(--destaque); }
  .capa h1 em { color: var(--fundo); text-decoration: underline; text-decoration-thickness: 10px; text-underline-offset: 12px; }
  .capa .linha { background: var(--fundo); }
  .capa .rodape { border-top-color: rgba(0,0,0,0.25); }
  .capa .rodape strong { color: var(--fundo); }
  .final h1 { font-size: 88px; }
</style>
</head>
<body>
  <div class="tela">
    <div class="topo">
      <span class="marca">@seuperfil</span><!-- MUDAR -->
      <span></span><!-- em carrossel: 1 / 5 -->
    </div>
    <div class="miolo">
      <span class="chapeu">Assunto</span><!-- MUDAR -->
      <h1>Um título curto com <em>destaque</em></h1><!-- MUDAR: até 8 palavras -->
      <div class="linha"></div>
      <p>Uma frase de apoio em até duas linhas. O detalhe vai na legenda.</p><!-- MUDAR -->
    </div>
    <div class="rodape">
      <span>@seuperfil</span><!-- MUDAR -->
      <strong>Salve para ver depois</strong><!-- MUDAR -->
    </div>
  </div>
</body>
</html>
